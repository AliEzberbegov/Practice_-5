# Режим запуска: local или remote (Selenoid)
type.run=local

# Какой браузер (chrome, firefox, etc.)
type.browser=chrome

# Версия браузера (используется ТОЛЬКО при remote)
browser.version=109.0

# URL для подключения к Selenoid (используется, если type.run=remote)
selenoid.url=http://jenkins.applineselenoid.fvds.ru:4444/wd/hub

# Включить ли VNC (true/false) при удалённом запуске
enableVNC=true

# Включить ли запись видео (true/false) при удалённом запуске
enableVideo=true

# Путь к chromedriver.exe (локально)
chrome.driver.path=src/test/resources/chromedriver.exe

# Путь к geckodriver.exe (если будете тестировать Firefox локально)
gecko.driver.path=src/test/resources/geckodriver.exe